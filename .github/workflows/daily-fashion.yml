name: Update Fashion Daily

on:
  schedule:
    # GitHub Actions cron uses UTC.
    # 22:10,25,40,55 UTC Sunday-Thursday = 07:10, 07:25, 07:40, 07:55 KST Monday-Friday.
    # Later checks skip generation when today's briefing already exists.
    - cron: "10,25,40,55 22 * * 0-4"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional KST date to regenerate, e.g. 2026-06-18"
        required: false
        type: string

permissions:
  contents: write
  models: read

concurrency:
  group: fashion-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check existing briefing
        id: existing
        shell: bash
        run: |
          target_date="${{ inputs.target_date }}"
          if [ -z "$target_date" ]; then
            target_date="$(TZ=Asia/Seoul date +%F)"
          fi
          echo "target_date=${target_date}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && grep -q "\"date\": \"${target_date}\"" data/issues.js; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Briefing for ${target_date} already exists. Skipping this backup schedule."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate today's briefing
        if: steps.existing.outputs.exists != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODEL: openai/gpt-4.1-mini
          TARGET_DATE: ${{ inputs.target_date }}
        run: node scripts/update-daily.mjs

      - name: Commit archive update
        if: steps.existing.outputs.exists != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODEL: openai/gpt-4.1-mini
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          echo "DLM workflow v16: 07:10 KST plus 15-minute checks through 07:55 with duplicate-date skip"
          target_date="${TARGET_DATE:-$(TZ=Asia/Seoul date +%F)}"
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_and_push() {
            git add -A
            if git diff --cached --quiet; then
              echo "No changes to commit."
              return 0
            fi
            git commit -m "Update Fashion Daily for ${target_date}"
            git push origin HEAD:main
          }

          if commit_and_push; then
            exit 0
          fi

          echo "Initial push was rejected. Syncing latest main and regenerating once."
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

          node scripts/update-daily.mjs

          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes after syncing latest main."
            exit 0
          fi

          commit_and_push
